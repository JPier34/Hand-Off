[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = true

# Branch deploys — ogni branch non-main ottiene il proprio URL di preview
[context.branch-deploy]
  command = "npm run build"
  publish = "dist"

# Context esplicito per test-jpier (le env var vengono impostate nel dashboard Netlify)
[context.test-jpier]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from   = "/api/uniswap/*"
  to     = "/.netlify/functions/uniswap?path=:splat"
  status = 200
  force  = true
