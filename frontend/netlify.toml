[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These are intentionally client-side (public SDK IDs, non-sensitive config)
  SECRETS_SCAN_OMIT_KEYS = "DYNAMIC_ENVIRONMENT_ID,CHAIN_ID,MOCK"
  PNPM_FLAGS = "--no-frozen-lockfile"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = true
