[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Production (main branch) — targets Ethereum Mainnet
[context.production]
  command = "npm run build"
  publish = "dist"
  [context.production.environment]
    VITE_NETWORK = "mainnet"

# CHAIN_ID (11155111 = Eth Sepolia) is a public constant, not a secret.
# Netlify's scanner false-positives on it because it matches the CHAIN_ID env var value.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "CHAIN_ID"

[functions]
  directory = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = true

# Branch deploys — ogni branch non-main ottiene il proprio URL di preview
[context.branch-deploy]
  command = "npm run build"
  publish = "dist"

# Context esplicito per test-jpier — punta a Eth Sepolia per test funzionale
[context.test-jpier]
  command = "npm run build"
  publish = "dist"
  [context.test-jpier.environment]
    VITE_NETWORK = "sepolia"

[[redirects]]
  from   = "/api/uniswap/*"
  to     = "/.netlify/functions/uniswap?path=:splat"
  status = 200
  force  = true
